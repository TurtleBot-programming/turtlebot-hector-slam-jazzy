# docker compose -f docker/compose.yaml up      -> http://localhost:8080
# Host networking and host IPC are needed so ROS 2 discovery reaches the robot.
services:
  tb4-slam:
    image: tb4-hector-slam:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    network_mode: host
    ipc: host
    volumes:
      - ../data:/data
    # devices: ["/dev/dri:/dev/dri"]   # uncomment on a machine with a GPU for a faster Gazebo
    restart: "no"
